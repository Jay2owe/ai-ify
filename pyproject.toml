[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ify"
version = "0.4.3"
description = "Embed a subscription-backed AI agent inside any app, controlled the way the developer allows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/aiify/static/vendor/PAGE_CONTROLLER_LICENSE"]
authors = [{name = "Brancaccio Lab"}]
keywords = ["ai agent", "embedded assistant", "agent client protocol", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Agent Client Protocol: one protocol for the Claude and Codex adapters.
    # Pre-1.0 and changing quickly, so pinned to the verified minor version.
    "agent-client-protocol>=0.12,<0.13",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=12"]   # the panel talks over a websocket
test = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.49,<2"]
release = ["build>=1.2", "twine>=6.1"]

[project.urls]
Homepage = "https://github.com/Jay2owe/ai-ify"
Documentation = "https://github.com/Jay2owe/ai-ify/blob/main/docs/embedding-guide.md"
Issues = "https://github.com/Jay2owe/ai-ify/issues"
Changelog = "https://github.com/Jay2owe/ai-ify/blob/main/CHANGELOG.md"

[project.scripts]
aiify = "aiify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiify = ["static/*", "static/vendor/*", "guide/*.md", "README_AI.md", "aiify_context.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["browser: real headless-browser tests (Playwright)"]
